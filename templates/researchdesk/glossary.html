{% extends "researchdesk/layout.html" %}{% block desk_content %}<h1 class="text-3xl font-bold">SEC disclosure glossary</h1><form method="get" class="mt-6"><label for="q" class="field-label">Find a term or definition</label><input id="q" name="q" class="input" value="{{ q }}" maxlength="100"><button class="btn-primary mt-3">Find terms</button></form><dl class="mt-6">{% for item in terms %}<dt class="text-xl font-semibold mt-5">{{ item.term }}</dt><dd class="mt-2">{{ item.definition }} <a class="link" href="{{ item.source }}">SEC source documentation</a></dd>{% empty %}<dt>No matching terms</dt><dd>Try a shorter word.</dd>{% endfor %}</dl>{% endblock %}
