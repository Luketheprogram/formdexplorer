<p class="mt-4 text-sm leading-relaxed text-slate-600">Offering amounts describe securities offered; amounts sold are issuer-reported as of each filing. Amendments can repeat earlier amounts. We do not add these figures into a capital-raised total. Missing amounts are not zero. <a class="link" href="/learn/form-d-data-methodology/">Data coverage and methodology</a> · <a class="link" href="/learn/form-d-offering-amount-vs-amount-sold/">How to interpret the amounts</a>.</p>
