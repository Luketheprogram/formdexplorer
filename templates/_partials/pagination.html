{% if page_obj.has_other_pages %}
<nav class="mt-6 flex items-center justify-between text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn-secondary btn-sm" href="{% if page_obj.previous_page_number == 1 %}{{ request.path }}{% else %}?page={{ page_obj.previous_page_number }}{% endif %}">← Previous</a>{% else %}<span></span>{% endif %}
  <span class="text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn-secondary btn-sm" href="?page={{ page_obj.next_page_number }}">Next →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
