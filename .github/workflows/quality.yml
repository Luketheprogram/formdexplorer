name: Public-data quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: formd_quality_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/formd_quality_ci
      SECRET_KEY: isolated-ci-only-not-a-production-secret
      ADSENSE_ENABLED: 'False'
      ADSENSE_CMP_READY: 'False'
      GOOGLE_PRIVACY_ENABLED: 'False'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Build the release CSS before measuring assets
        run: |
          curl -fsSL -o /tmp/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -c tailwind.config.js -i static/src/input.css -o static/css/app.css --minify
      - run: python scripts/check_asset_budgets.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
